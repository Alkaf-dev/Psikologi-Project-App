openapi: 3.0.3
info:
  title: Psikologi Connect API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    REST API untuk aplikasi Psikologi Connect. Semua data akademik berasal dari
    Google Sheets. Autentikasi memakai Bearer token per pengguna yang diterbitkan
    oleh endpoint login dan disimpan sebagai hash pada sheet `api_tokens`.

    Role:
    - `mahasiswa` hanya dapat mengakses endpoint `/student/*`.
    - `pjmk` (label Admin) dan `super_admin` dapat mengakses `/staff/*`.
    - Endpoint publik tidak memerlukan token.

    Respons daftar memakai format `{data, meta, links}`. Respons detail memakai
    `{data}` dan operasi tulis biasanya menyertakan `message`.
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Server lokal
  - url: https://psikologi.example.com/api/v1
    description: Produksi (ganti dengan domain Anda)
security: []
tags:
  - name: Public
    description: Endpoint tanpa autentikasi
  - name: Auth
    description: Login, profil, password, dan token
  - name: Notifications
    description: Notifikasi tugas dan jadwal
  - name: Student
    description: Endpoint khusus mahasiswa
  - name: Staff Dashboard
    description: Ringkasan data staff
  - name: Staff Users
    description: Akun pengguna
  - name: Staff Study Programs
    description: Program studi
  - name: Staff Courses
    description: Mata kuliah
  - name: Staff Schedules
    description: Jadwal kuliah
  - name: Staff Groups
    description: Kelompok mahasiswa
  - name: Staff Tasks
    description: Tugas
  - name: Staff Submissions
    description: Pengumpulan dan nilai
  - name: Staff Announcements
    description: Pengumuman
  - name: Staff Settings
    description: Pengaturan aplikasi

paths:
  /:
    get:
      tags: [Public]
      summary: Informasi API
      description: Metadata versi, autentikasi, dan daftar resource utama.
      responses:
        '200':
          description: Informasi API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInfo'
              example:
                name: Psikologi Connect API
                version: v1
                documentation: docs/openapi.yaml
                authentication:
                  type: Bearer
                  login_endpoint: /api/v1/auth/login
                resources:
                  study_programs: /api/v1/study-programs
                  announcements: /api/v1/announcements
                  settings: /api/v1/settings
                  student: /api/v1/student/*
                  staff: /api/v1/staff/*

  /study-programs:
    get:
      tags: [Public]
      summary: Daftar program studi aktif
      parameters:
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Daftar program studi aktif tanpa pagination
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StudyProgram'

  /announcements:
    get:
      tags: [Public]
      summary: Daftar pengumuman publik
      description: Hanya pengumuman dengan audiens `all` yang sudah dipublikasikan.
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: sort
          in: query
          schema:
            type: string
            enum: [published_at, title]
            default: published_at
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: Daftar pengumuman publik
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementCollection'

  /announcements/{id}:
    get:
      tags: [Public]
      summary: Detail pengumuman publik
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Detail pengumuman
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /settings:
    get:
      tags: [Public]
      summary: Pengaturan publik
      responses:
        '200':
          description: Pengaturan yang aman ditampilkan ke publik
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicSettings'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login dan terbitkan Bearer token
      description: |
        Login memakai email atau NIM, password, dan Prodi aktif. Token plaintext
        hanya dikembalikan sekali pada respons ini. Simpan sebagai Bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: ayu@psikologi.test
              password: password
              prodi_id: 01M5C0V9EWP828SVQ4W8CRKD1T
              device_name: Flutter Android
              expires_in_days: 30
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token_type: Bearer
                access_token: v1.01M5C0V9EWP828SVQ4W8CRKD1T.abcdefghijklmnopqrstuvwxyz0123456789
                expires_at: '2026-11-22T10:00:00+07:00'
                token:
                  id: 01M5C0V9EWP828SVQ4W8CRKD1T
                  user_id: 01M5BFPTQ2MKR8ASWTCW9V0AZ6
                  name: Flutter Android
                  last_used_at: null
                  expires_at: '2026-11-22T10:00:00+07:00'
                  revoked_at: null
                  created_at: '2026-10-23T10:00:00+07:00'
                  updated_at: '2026-10-23T10:00:00+07:00'
                user:
                  id: 01M5BFPTQ2MKR8ASWTCW9V0AZ6
                  name: Ayu Lestari
                  email: ayu@psikologi.test
                  npm: '2024001'
                  role: mahasiswa
                  role_label: Mahasiswa
                  prodi_id: 01M5C0V9EWP828SVQ4W8CRKD1T
                  prodi_name: Psikologi
                  active: true
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout dan cabut token aktif
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Token berhasil dicabut
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil pengguna saat ini
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/profile:
    patch:
      tags: [Auth]
      summary: Perbarui nama dan nomor telepon
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 120
                phone:
                  type: string
                  maxLength: 30
                  nullable: true
            example:
              name: Ayu Lestari
              phone: '0812-0000-0001'
      responses:
        '200':
          description: Profil setelah diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/password:
    put:
      tags: [Auth]
      summary: Ubah password sendiri
      description: Password baru minimal 8 karakter dan harus dikonfirmasi. Token lain milik pengguna dicabut; token yang sedang dipakai tetap aktif.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password:
                  type: string
                password:
                  type: string
                  minLength: 8
                  format: password
                password_confirmation:
                  type: string
                  format: password
            example:
              current_password: password
              password: password-baru
              password_confirmation: password-baru
      responses:
        '200':
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Password berhasil diperbarui.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/tokens:
    get:
      tags: [Auth]
      summary: Daftar token aktif milik pengguna
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token aktif
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/tokens/{id}:
    delete:
      tags: [Auth]
      summary: Cabut token lain
      description: Gunakan endpoint logout untuk mencabut token yang sedang dipakai.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Token dicabut
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /notifications:
    get:
      tags: [Notifications]
      summary: Daftar notifikasi tugas dan jadwal
      security:
        - bearerAuth: []
      parameters:
        - name: unread
          in: query
          description: Jika true, hanya notifikasi yang belum dibaca.
          schema:
            type: boolean
      responses:
        '200':
          description: Notifikasi beserta jumlah belum dibaca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/read:
    post:
      tags: [Notifications]
      summary: Tandai satu notifikasi sudah dibaca
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  maxLength: 191
            example:
              key: task:01M5BFPVH5Q2D9RV135KRP77N4:1792800000
      responses:
        '200':
          description: Notifikasi ditandai sudah dibaca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Tandai semua notifikasi sudah dibaca
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Semua notifikasi ditandai sudah dibaca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /student/dashboard:
    get:
      tags: [Student]
      summary: Ringkasan dashboard mahasiswa
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ringkasan tugas, jadwal, kelompok, dan pengumuman
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/StudentDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /student/courses:
    get:
      tags: [Student]
      summary: Mata kuliah mahasiswa
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: sort
          in: query
          schema:
            type: string
            enum: [code, name, semester, credits]
            default: name
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: Daftar mata kuliah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /student/schedules:
    get:
      tags: [Student]
      summary: Jadwal kuliah mahasiswa
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: day
          in: query
          schema:
            $ref: '#/components/schemas/Day'
        - name: mode
          in: query
          schema:
            $ref: '#/components/schemas/ScheduleMode'
        - $ref: '#/components/parameters/CourseIdFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar jadwal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /student/tasks:
    get:
      tags: [Student]
      summary: Tugas yang dapat diakses mahasiswa
      description: Tugas kelompok hanya muncul jika kelompok mahasiswa ditugaskan. Status pengumpulan dan aksi tersedia pada setiap item.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/CourseIdFilter'
        - name: type
          in: query
          schema:
            type: string
            enum: [individu, kelompok]
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: sort
          in: query
          schema:
            type: string
            enum: [deadline, title, created_at]
            default: deadline
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar tugas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentTaskCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /student/tasks/{id}:
    get:
      tags: [Student]
      summary: Detail tugas mahasiswa
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Detail tugas
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/StudentTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /student/tasks/{id}/submission:
    post:
      tags: [Student]
      summary: Kumpulkan atau perbarui pengumpulan tugas
      description: |
        Link wajib berupa URL http/https. Tugas individu di-upsert per mahasiswa.
        Tugas kelompok di-upsert per kelompok dan hanya perwakilan yang dapat
        memperbarui. Perubahan setelah deadline untuk tugas kelompok ditolak.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link]
              properties:
                link:
                  type: string
                  format: uri
                  maxLength: 500
                notes:
                  type: string
                  maxLength: 5000
                  nullable: true
            example:
              link: https://docs.google.com/document/d/contoh-tugas
              notes: Sudah saya kerjakan.
      responses:
        '201':
          description: Pengumpulan baru berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '200':
          description: Pengumpulan yang sudah ada berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /student/groups:
    get:
      tags: [Student]
      summary: Kelompok mahasiswa
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/CourseIdFilter'
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, created_at]
            default: name
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar kelompok beserta anggota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /student/groups/{id}:
    get:
      tags: [Student]
      summary: Detail kelompok mahasiswa
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Detail kelompok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /student/announcements:
    get:
      tags: [Student]
      summary: Pengumuman untuk mahasiswa
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/CourseIdFilter'
        - name: sort
          in: query
          schema:
            type: string
            enum: [published_at, title]
            default: published_at
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar pengumuman
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /staff/dashboard:
    get:
      tags: [Staff Dashboard]
      summary: Ringkasan data staff
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistik dan pengumuman terbaru
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/StaffDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /staff/students:
    get:
      tags: [Staff Users]
      summary: Daftar mahasiswa
      description: Sama dengan `/staff/users` dengan filter role mahasiswa.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchUsers'
        - $ref: '#/components/parameters/ProdiIdFilter'
        - $ref: '#/components/parameters/ActiveFilter'
        - $ref: '#/components/parameters/SortUsers'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar mahasiswa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /staff/users:
    get:
      tags: [Staff Users]
      summary: Daftar pengguna
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SearchUsers'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - $ref: '#/components/parameters/ProdiIdFilter'
        - $ref: '#/components/parameters/ActiveFilter'
        - $ref: '#/components/parameters/SortUsers'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Staff Users]
      summary: Tambah pengguna
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
            example:
              name: Mahasiswa Baru
              npm: '2024999'
              email: mahasiswa.baru@psikologi.test
              role: mahasiswa
              prodi_id: 01M5C0V9EWP828SVQ4W8CRKD1T
              password: password-baru
              class_name: Psikologi A
              cohort: '2024'
              phone: 0812-0000-9999
              active: true
              group_assignments:
                - course_id: 01M5BFPVAP8GSEH32SD4X4TTE9
                  group_id: null
      responses:
        '201':
          description: Pengguna berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /staff/users/{id}:
    get:
      tags: [Staff Users]
      summary: Detail pengguna
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Detail pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Staff Users]
      summary: Perbarui pengguna
      description: Field yang tidak dikirim dipertahankan.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
            example:
              name: Nama Diperbarui
              active: true
      responses:
        '200':
          description: Pengguna setelah diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
