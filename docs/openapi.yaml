components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Token dari `/auth/login`, dikirim sebagai `Authorization: Bearer <access_token>`.'

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: ULID record
      schema:
        type: string
    Search:
      name: search
      in: query
      description: Pencarian case-insensitive pada field teks resource.
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Direction:
      name: direction
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    CourseIdFilter:
      name: course_id
      in: query
      schema:
        type: string
    ProdiIdFilter:
      name: prodi_id
      in: query
      schema:
        type: string
    ActiveFilter:
      name: active
      in: query
      schema:
        type: boolean
    SearchUsers:
      name: search
      in: query
      description: Cari pada name, npm, email, class_name, cohort, dan phone.
      schema:
        type: string
    SortUsers:
      name: sort
      in: query
      schema:
        type: string
        enum: [name, npm, email, class_name, cohort, created_at]
        default: name

  responses:
    Unauthorized:
      description: Token tidak ada, tidak valid, kedaluwarsa, dicabut, atau akun nonaktif
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthenticated.
    Forbidden:
      description: Role tidak memiliki akses ke endpoint ini
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Forbidden.
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Data tidak ditemukan.
    Unprocessable:
      description: Permintaan tidak dapat diproses karena aturan bisnis
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Tugas ini sudah selesai atau belum dipublikasikan.
    ValidationError:
      description: Validasi request gagal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: The given data was invalid.
            errors:
              email:
                - Email sudah digunakan oleh user lain.
    TooManyRequests:
      description: Rate limit terlampaui
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Too Many Attempts.

  schemas:
    ApiInfo:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        documentation:
          type: string
        authentication:
          type: object
          properties:
            type:
              type: string
            login_endpoint:
              type: string
        resources:
          type: object
          additionalProperties:
            type: string

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
      example:
        message: Data tidak ditemukan.

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    Message:
      type: object
      properties:
        message:
          type: string

    ReadReceipt:
      type: object
      required: [message, unread_count]
      properties:
        message:
          type: string
        unread_count:
          type: integer

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        last_page:
          type: integer
        total:
          type: integer
        from:
          type: integer
          nullable: true
        to:
          type: integer
          nullable: true

    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          format: uri
        prev:
          type: string
          format: uri
          nullable: true
        next:
          type: string
          format: uri
          nullable: true
        last:
          type: string
          format: uri
          nullable: true

    UserRole:
      type: string
      enum: [mahasiswa, super_admin, pjmk]
      description: Gunakan pjmk untuk Admin. Nilai lama admin tetap dibaca sebagai super_admin jika ada di sheet.

    Day:
      type: string
      enum: [Senin, Selasa, Rabu, Kamis, Jumat, Sabtu, Minggu]

    ScheduleMode:
      type: string
      enum: [offline, online]

    TaskType:
      type: string
      enum: [individu, kelompok]

    TaskStatus:
      type: string
      enum: [draft, active, completed]

    SubmissionStatus:
      type: string
      enum: [submitted, late, graded]

    Audience:
      type: string
      enum: [all, mahasiswa, admin]

    LoginRequest:
      type: object
      required: [login, password, prodi_id]
      properties:
        login:
          type: string
          description: Email atau NIM
          maxLength: 150
        password:
          type: string
          format: password
        prodi_id:
          type: string
        device_name:
          type: string
          maxLength: 100
          default: API Client
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          description: Default dari API_TOKEN_TTL_DAYS (30 hari).

    LoginResponse:
      type: object
      required: [token_type, access_token, expires_at, token, user]
      properties:
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
          description: Token plaintext. Hanya ditampilkan sekali.
        expires_at:
          type: string
          format: date-time
          nullable: true
        token:
          $ref: '#/components/schemas/Token'
        user:
          $ref: '#/components/schemas/User'

    Token:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: Hanya ada pada daftar token.

    User:
      type: object
      required: [id, name, email, npm, role, active]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        npm:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        role_label:
          type: string
        class_name:
          type: string
        cohort:
          type: string
        phone:
          type: string
        active:
          type: boolean
        prodi_id:
          type: string
        prodi_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 01M5BFPTQ2MKR8ASWTCW9V0AZ6
        name: Ayu Lestari
        email: ayu@psikologi.test
        npm: '2024001'
        role: mahasiswa
        role_label: Mahasiswa
        class_name: Psikologi A
        cohort: '2024'
        phone: 0812-0000-0001
        active: true
        prodi_id: 01M5C0V9EWP828SVQ4W8CRKD1T
        prodi_name: Psikologi
        created_at: '2026-10-20T01:44:39+00:00'
        updated_at: '2026-10-20T13:44:12+07:00'

    UserCreateRequest:
      type: object
      required: [name, npm, email, role, prodi_id, password]
      properties:
        name:
          type: string
          maxLength: 120
        npm:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 150
        role:
          $ref: '#/components/schemas/UserRole'
        prodi_id:
          type: string
        password:
          type: string
          minLength: 8
          format: password
        class_name:
          type: string
          maxLength: 50
          description: Wajib untuk role mahasiswa.
        cohort:
          type: string
          maxLength: 10
        phone:
          type: string
          maxLength: 30
        active:
          type: boolean
          default: true
        group_assignments:
          type: array
          items:
            type: object
            required: [course_id]
            properties:
              course_id:
                type: string
              group_id:
                type: string
                nullable: true

    UserUpdateRequest:
      type: object
      description: Semua field opsional. Jika password diisi, token pengguna dicabut.
